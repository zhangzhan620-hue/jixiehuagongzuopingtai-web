<script>

function render(){const c=state.config;document.title=c.title+' · 学生任务工作页';$('app').innerHTML='<section class="panel"><div class="eyebrow">我的工作任务 · 我的选择与证据</div><h1>'+esc(c.title)+'</h1><span class="pill">'+esc(c.time)+'</span><div class="mission"><h3>我接受的任务</h3><p>'+esc(c.mission)+'</p></div><div class="two"><div><h3>我最终交付什么</h3><p>'+esc(c.product)+'</p></div><div><h3>我要学会什么</h3><p>'+esc(c.goals)+'</p></div></div><p class="muted" style="margin-top:14px">'+esc(c.basis)+'</p><div class="three">'+[['name','姓名 / 学号'],['group','班级 / 小组'],['date','日期']].map(([k,l])=>'<div><label class="field" for="'+k+'">'+l+'</label><input id="'+k+'" data-answer="'+k+'" maxlength="120" value="'+esc(answer(k))+'"></div>').join('')+'</div><div class="notice">只记录关键选择与证据，不必填满每一格。可以用草图、照片、文件位置或教师确认的口述说明；遇到问题可随时返回修改。</div><div class="row"><div><strong id="progressText"></strong><div class="progress"><span id="progressBar"></span></div><span class="muted">由我标记完成情况，不代表能力评分。</span></div><div class="toolbar"><button class="btn" data-export="blank">导出空白学生版</button><button class="btn primary" data-export="filled">导出已填写工作页</button><button class="btn" id="print">打印 / PDF</button></div></div><p class="muted" id="saveStatus" role="status">'+(storageOK?'填写后自动保存在此浏览器；建议导出备份。':'浏览器本地保存不可用，请使用导出备份。')+'</p><p class="muted">本页不上传资料，不自动调用 AI。教师设置属于编辑入口，不是权限系统。</p></section><nav class="nav">'+c.cards.map((a,i)=>'<a href="#card-'+i+'">'+(i+1)+' · '+esc(a.title)+'</a>').join('')+'</nav>'+c.cards.map((a,i)=>card(a,i)).join('')+'<section class="panel"><div class="eyebrow">交付前，再看一眼</div><h2>我的作品检查</h2><div class="checks">'+c.checks.map((t,i)=>'<label class="check"><input type="checkbox" data-answer="check-'+i+'" '+(answer('check-'+i)?'checked':'')+'><span>'+esc(t)+'</span></label>').join('')+'</div>'+field('helpRecord','如果我使用了同伴、教师或 AI 的帮助：哪些帮助被我采用，我怎样验证？','没有使用 AI 也可以。简要说清自己的操作与获得的帮助即可。')+'<p class="muted">这里的勾选是自检记录，教师会结合你的作品、操作与解释判断掌握情况。</p></section><p class="foot">学生主体 · 实际工作步骤 · 少量关键证据。当前为已生成工作页；更换任务需重新设计内容。导出空白版会清除副本中的个人回答和照片，但保留教师设置。</p>';updateProgress()}
function card(a,i){let photo=answer('photo-'+i);return '<article class="card" id="card-'+i+'"><div class="row"><span class="pill">'+esc(a.time)+'</span><label class="done"><input type="checkbox" data-answer="done-'+i+'" '+(answer('done-'+i)?'checked':'')+'>我已完成这部分工作</label></div><h2>'+esc(a.title)+'</h2><div class="action"><h3>我来做</h3><ol>'+a.steps.split('\n').filter(Boolean).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div><div class="two"><div>'+field('choice-'+i,a.choice)+'</div><div>'+field('record-'+i,a.record)+'</div></div><p class="evidence"><strong>留下的证据：</strong>'+esc(a.evidence)+'</p>'+field('evidence-'+i,'我的证据放在哪里？','写文件名、纸质页码、图上的标注，或在下面附一张照片。')+'<div class="upload"><span class="muted">可选：附一张关键证据图（PNG / JPEG / WebP，≤800 KB）。无需重复上传全部作品。</span><input class="no-print" type="file" accept="image/png,image/jpeg,image/webp" data-photo="'+i+'" aria-label="上传第'+(i+1)+'部分的证据图片"><div id="photoBox-'+i+'">'+photoMarkup(photo,i)+'</div></div><details class="support"><summary>卡住了？先试一试，再寻求帮助</summary><p>'+esc(a.help)+'</p><p><strong>需要 AI 时：</strong>先描述自己的尝试，再提出具体困难；保留自己的选择与操作。</p><button class="btn no-print" data-prompt="'+i+'">复制本环节求助提示词</button><p class="muted">复制后自行选择教师认可的工具；本页不会发送信息或代做任务。</p></details></article>'}
function photoMarkup(src,i){return /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(src)?'<img class="photo" src="'+src+'" alt="第'+(i+1)+'部分的学习证据"><button class="btn remove-photo no-print" data-remove="'+i+'">移除这张图片</button>':''}
function updateProgress(){const total=state.config.cards.length,done=state.config.cards.filter((_,i)=>state.answers['done-'+i]).length;$('progressText').textContent='我的工作进度 '+done+' / '+total;$('progressBar').style.width=done/total*100+'%'}
function saveInput(el){if(!el.dataset.answer)return;const k=el.dataset.answer;state.answers[k]=el.type==='checkbox'?el.checked:el.value;const p=document.querySelector('[data-print="'+k+'"]');if(p)p.textContent=el.value;updateProgress();clearTimeout(saveTimer);saveTimer=setTimeout(persist,300)}
async function upload(el){const file=el.files[0];if(!file)return;const i=el.dataset.photo;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>800*1024){toast('请选择不超过 800 KB 的 PNG、JPEG 或 WebP 图片。');el.value='';return}try{const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src});state.answers['photo-'+i]=src;$('photoBox-'+i).innerHTML=photoMarkup(src,i);persist()}catch{toast('图片读取失败，请重新选择。')}el.value=''}
async function copyPrompt(i){const c=state.config.cards[i];const text='学习任务：'+state.config.title+'\n当前操作：'+c.title+'\n'+c.ai+'\n我的已有尝试与具体困难：【请补充，不包含不必要的个人信息】';try{await navigator.clipboard.writeText(text);toast('提示词已复制，请补充自己的尝试后使用。')}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();toast(ok?'提示词已复制。':'浏览器未允许复制；请向教师描述你的具体困难。')}}
function exportPage(blank){clearTimeout(saveTimer);const payload=JSON.parse(JSON.stringify(state));payload.id='workpage-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);if(blank)payload.answers={};const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#teacherFields').innerHTML='';clone.querySelector('#teacherDialog').removeAttribute('open');clone.querySelector('#toast').textContent='';clone.querySelector('#toast').classList.add('hidden');clone.querySelector('#seed').textContent=JSON.stringify(payload).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(state.config.title.replace(/[\\/:*?"<>|]/g,'_')||'学习任务')+(blank?'-空白学生工作页':'-已填写工作页')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(blank?'已导出空白副本，未包含个人回答与照片。':'已导出填写内容与照片，打开文件可继续编辑。')}
const teacherKeys=[['title','任务名称'],['time','课时说明'],['mission','用途与工作情境'],['goals','学生要学会什么'],['product','交付成果与要求'],['basis','学生基础与工具条件']];const cardKeys=[['title','实际工作活动'],['time','时段与用时'],['steps','操作安排（每行一步，自行核对时间合计）'],['choice','引导学生作出选择的问题'],['record','引导学生解释与验证的问题'],['evidence','需要保留的最少证据'],['help','教师或同伴可以怎样提示'],['ai','可选 AI 求助提示词']];
function teacherField(id,label,value){return '<label class="field" for="'+id+'">'+label+'</label><textarea id="'+id+'" required maxlength="4000">'+esc(value)+'</textarea>'}
function editTeacher(){$('teacherFields').innerHTML=teacherKeys.map(([k,l])=>teacherField('t-'+k,l,state.config[k])).join('')+teacherField('t-checks','交付检查项（每行一项）',state.config.checks.join('\n'))+state.config.cards.map((c,i)=>'<section class="teacher-section"><h3>活动 '+(i+1)+'</h3>'+cardKeys.map(([k,l])=>teacherField('t-'+i+'-'+k,l,c[k])).join('')+'</section>').join('');$('teacherDialog').showModal()}
function saveTeacher(e){e.preventDefault();const c=JSON.parse(JSON.stringify(state.config));for(const [k]of teacherKeys)c[k]=$('t-'+k).value.trim();c.checks=$('t-checks').value.split('\n').map(s=>s.trim()).filter(Boolean);c.cards.forEach((a,i)=>cardKeys.forEach(([k])=>a[k]=$('t-'+i+'-'+k).value.trim()));if(!c.checks.length||teacherKeys.some(([k])=>!c[k])||c.cards.some(a=>cardKeys.some(([k])=>!a[k]))){toast('请补齐任务说明。');return}const changed=JSON.stringify(c)!==JSON.stringify(state.config);if(changed&&Object.values(state.answers).some(Boolean)){if(!confirm('任务设置改变后，原回答可能不再适用。保存将清空本页学生回答与照片；需要保留时请取消并先导出。继续？'))return;state.answers={}}state.config=c;$('teacherDialog').close();render();persist();toast('任务已更新，可导出空白版发给学生。')}
$('app').addEventListener('input',e=>saveInput(e.target));$('app').addEventListener('change',e=>{if(e.target.dataset.photo!==undefined)upload(e.target);else saveInput(e.target)});$('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.export)exportPage(b.dataset.export==='blank');else if(b.id==='print')window.print();else if(b.dataset.prompt!==undefined)copyPrompt(Number(b.dataset.prompt));else if(b.dataset.remove!==undefined){delete state.answers['photo-'+b.dataset.remove];$('photoBox-'+b.dataset.remove).innerHTML='';persist()}});$('teacher').addEventListener('click',editTeacher);$('cancelTeacher').addEventListener('click',()=>$('teacherDialog').close());$('teacherForm').addEventListener('submit',saveTeacher);window.addEventListener('beforeunload',()=>{if(saveTimer){clearTimeout(saveTimer);try{localStorage.setItem('workpage:'+state.id,JSON.stringify(state))}catch{}}});render();
</script><script>
const baseRender=render;
render=function(){baseRender();
 const node=document.createElement('section');node.className='panel';node.id='evaluation';
 node.innerHTML='<h2>怎样评价我的学习</h2><p>课前20分 · 课中70分 · 课后10分，总分100分。课中：文化审美14、技术规范21、交互功能21、规范意识14。</p><p class="muted">以下为本任务评价依据，不自动计分。教师结合实际成果、个人操作和解释确认；勾选完成不等于掌握。±0.5mm沿用教学方案的案例要求，实施前由教师确认。标准中的3轮测试为本任务基础验证。</p><details><summary>展开查看15项评价内容与方式</summary><div class="rubrics"><table><thead><tr><th>阶段 / 项目</th><th>分值</th><th>评价内容</th><th>评价方式</th></tr></thead><tbody>'+state.config.rubrics.map(r=>'<tr><td>'+esc(r.phase+' / '+r.item)+'</td><td>'+r.max+'</td><td>'+esc(r.standard)+'</td><td>'+esc(r.method)+'</td></tr>').join('')+'</tbody></table></div></details>';
 $('app').insertBefore(node,$('app').querySelector('nav'));
 const hints={
 'record-2':'测量部位：\n设计值/mm：\n实测值/mm：\n偏差/mm（实测－设计）：\n自检/互检人：\n整改与复测：',
 'record-3':'关键代码与我的解释：\n修改参数/条件：\n预测：\n实际：\nAI建议采纳或修正及理由：',
 'record-4':'第1轮：触发/复位；开合；灯光；异常\n第2轮：触发/复位；开合；灯光；异常\n第3轮：触发/复位；开合；灯光；异常\n一次修改与复测：\n未达标项：'
 };Object.entries(hints).forEach(([id,t])=>{if($(id)){$(id).placeholder=t;$(id).style.minHeight='190px'}});
};render();
window.addEventListener('beforeprint',()=>document.querySelector('#evaluation details').open=true);
</script></body></html>
